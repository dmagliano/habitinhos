spring:
  application:
    name: habitinhos-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/habitinhos}
    username: ${DATABASE_USERNAME:habitinhos}
    password: ${DATABASE_PASSWORD:habitinhos}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    br.com.habitinhos: ${LOG_LEVEL_APP:DEBUG}
    com.zaxxer.hikari: WARN
    org.hibernate: WARN
    org.springframework.security: INFO

habitinhos:
  security:
    jwt:
      issuer: ${HABITINHOS_JWT_ISSUER:habitinhos}
      expiration-minutes: ${HABITINHOS_JWT_EXPIRATION_MINUTES:120}
      secret: ${HABITINHOS_JWT_SECRET:dev-only-change-this-secret-with-at-least-32-bytes}
