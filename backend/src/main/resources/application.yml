server:
  port: ${PORT:8080}

spring:
  application:
    name: habitinhos-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD}}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    br.com.habitinhos: ${LOG_LEVEL_APP:DEBUG}
    com.zaxxer.hikari: WARN
    org.hibernate: WARN
    org.springframework.security: INFO

habitinhos:
  security:
    jwt:
      issuer: ${HABITINHOS_JWT_ISSUER:habitinhos}
      expiration-minutes: ${HABITINHOS_JWT_EXPIRATION_MINUTES:120}
      secret: ${HABITINHOS_JWT_SECRET}
