server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}

spring:
  profiles:
    default: local
  application:
    name: habitinhos-backend
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    br.com.habitinhos: ${LOG_LEVEL_APP:DEBUG}
    com.zaxxer.hikari: WARN
    org.hibernate: WARN
    org.springframework.security: INFO

habitinhos:
  demo:
    seed:
      enabled: ${HABITINHOS_DEMO_SEED_ENABLED:false}
  security:
    jwt:
      issuer: ${HABITINHOS_JWT_ISSUER:habitinhos}
      expiration-minutes: ${HABITINHOS_JWT_EXPIRATION_MINUTES:120}
  email:
    from: ${HABITINHOS_EMAIL_FROM:Habitinhos <onboarding@resend.dev>}
    user-agent: ${HABITINHOS_EMAIL_USER_AGENT:habitinhos-backend/1.0}
    resend:
      api-key: ${RESEND_API_KEY:}
      base-url: ${RESEND_BASE_URL:https://api.resend.com}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/habitinhos}
    username: ${SPRING_DATASOURCE_USERNAME:habitinhos}
    password: ${SPRING_DATASOURCE_PASSWORD:habitinhos}

habitinhos:
  security:
    jwt:
      secret: ${HABITINHOS_JWT_SECRET:habitinhos-local-development-secret-000000000000}

---
spring:
  config:
    activate:
      on-profile: render
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

habitinhos:
  security:
    jwt:
      secret: ${HABITINHOS_JWT_SECRET}
