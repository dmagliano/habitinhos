name: Automatic release backport

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  create-backport:
    name: Create master to development backport
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.head.ref, 'release/') ||
      startsWith(github.event.pull_request.head.ref, 'hotfix/'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Create backport branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          repository="${GITHUB_REPOSITORY}"
          event_file="${GITHUB_EVENT_PATH}"
          merged_pr_number="$(jq -r '.pull_request.number' "$event_file")"
          merged_pr_title="$(jq -r '.pull_request.title' "$event_file")"
          merged_pr_body="$(jq -r '.pull_request.body // ""' "$event_file")"
          merged_at="$(jq -r '.pull_request.merged_at // ""' "$event_file")"
          merge_commit="$(jq -r '.pull_request.merge_commit_sha // ""' "$event_file")"

          if [[ -n "$merged_at" ]]; then
            merge_date="$(date -u -d "$merged_at" +%Y%m%d)"
          else
            merge_date="$(date -u +%Y%m%d)"
          fi

          slug="$(printf '%s' "$merged_pr_title" \
            | iconv -f UTF-8 -t ASCII//TRANSLIT 2>/dev/null \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-48 \
            | sed -E 's/-+$//')"
          slug="${slug:-release}"
          branch="backport/${merge_date}-${slug}"

          git fetch origin master development
          if git diff --quiet origin/development...origin/master; then
            echo "master has no changes to backport to development."
            exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            existing_pr="$(gh pr list \
              --repo "$repository" \
              --head "$branch" \
              --base development \
              --state open \
              --json number \
              --jq '.[0].number // empty')"
            if [[ -n "$existing_pr" ]]; then
              echo "Backport branch already has open PR #$existing_pr; skipping duplicate."
              exit 0
            fi
            echo "Backport branch $branch already exists without an open PR." >&2
            exit 1
          fi

          git switch --create "$branch" origin/master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin "HEAD:$branch"

          summary="$(printf '%s\n' "$merged_pr_body" \
            | tr '\r\n' ' ' \
            | sed -E 's/[[:space:]]+/ /g; s/^ +//; s/ +$//' \
            | cut -c1-600)"
          summary="${summary:-Descrição não informada.}"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          {
            printf '## Backport automático\n\n'
            printf 'PRs de release/hotfix mergeados em `master`:\n\n'
            printf -- '- #%s — %s\n  %s\n\n' "$merged_pr_number" "$merged_pr_title" "$summary"
            printf 'Merge commit: `%s`\n\n' "$merge_commit"
            printf 'Este PR foi criado automaticamente para sincronizar `master` com `development`.\n'
          } > "$body_file"

          gh pr create \
            --repo "$repository" \
            --base development \
            --head "$branch" \
            --title "Backport: $merged_pr_title" \
            --body-file "$body_file"
