<body class="bg-background text-on-background font-body-md antialiased min-h-screen flex flex-col">

<header class="bg-background dark:bg-on-background docked full-width top-0 z-40 sticky">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto">

<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-xl overflow-hidden flex-shrink-0">
<span>👦</span>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary dark:text-primary-fixed truncate px-4">
                Habitinhos
            </h1>
<!-- Trailing Icon -->
<div class="text-primary dark:text-primary-fixed w-10 h-10 flex items-center justify-end flex-shrink-0">
<span class="material-symbols-outlined" data-icon="monetization_on">monetization_on</span>
</div>
</div>
</header>

<main class="flex-1 w-full max-w-7xl mx-auto px-margin-mobile pb-32 pt-sm">
<!-- Hero Balance Widget -->
<section class="flex flex-col items-center justify-center py-lg mb-lg bg-surface-container-lowest rounded-xl ambient-shadow border border-surface-container-highest">
<div class="flex items-center gap-xs text-tertiary-container animate-pulse-slow">
<span class="text-4xl">🪙</span>
</div>
<h2 class="font-headline-xl text-headline-xl text-on-background mt-sm">120</h2>
<p class="font-label-md text-label-md text-on-surface-variant mt-xs">moedas disponíveis</p>
</section>
<!-- Rewards Section Title -->
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-md">O que você quer resgatar?</h3>
<!-- Rewards Flex List -->
<div class="flex flex-col gap-md">
<!-- Card 1: Affordable -->
<article class="bg-surface-container-lowest rounded-xl p-md ambient-shadow border border-surface-variant flex flex-col justify-between transition-transform active:scale-95 duration-100 ease-in-out cursor-pointer hover:border-primary-container group">
<div class="flex items-center gap-md mb-md">
<div class="w-14 h-14 rounded-full bg-secondary-container/30 flex items-center justify-center text-3xl flex-shrink-0 group-hover:scale-110 transition-transform">
                        🎬
                    </div>
<div class="flex-1">
<h4 class="font-label-md text-lg font-bold text-on-background line-clamp-2">Filme da noite</h4>
<div class="flex items-center gap-xs mt-xs text-tertiary-container font-label-md text-label-md">
<span class="text-sm">🪙</span> 50 moedas
                        </div>
</div>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary-container font-label-md text-lg font-bold rounded-xl flex items-center justify-center gap-xs hover:bg-primary-fixed-dim transition-colors shadow-sm">
                    Resgatar
                </button>
</article>
<!-- Card 2: Affordable -->
<article class="bg-surface-container-lowest rounded-xl p-md ambient-shadow border border-surface-variant flex flex-col justify-between transition-transform active:scale-95 duration-100 ease-in-out cursor-pointer hover:border-primary-container group">

<div class="w-14 h-14 rounded-full bg-tertiary-container/30 flex items-center justify-center text-3xl flex-shrink-0 group-hover:scale-110 transition-transform">
                        🍦
                    </div>
<div class="flex-1">
<h4 class="font-label-md text-lg font-bold text-on-background line-clamp-2">Sobremesa especial</h4>
<div class="flex items-center gap-xs mt-xs text-tertiary-container font-label-md text-label-md">
<span class="text-sm">🪙</span> 80 moedas
                        </div>
</div>
</div>
<button class="w-full h-14 bg-primary-container text-on-primary-container font-label-md text-lg font-bold rounded-xl flex items-center justify-center gap-xs hover:bg-primary-fixed-dim transition-colors shadow-sm">
                    Resgatar
                </button>
</article>
<!-- Card 3: Goal / Disabled -->
<article class="bg-surface-container-lowest rounded-xl p-md ambient-shadow border border-surface-variant flex flex-col justify-between opacity-80">
<div class="flex items-center gap-md mb-md">
<div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center text-3xl flex-shrink-0 grayscale">

                    </div>

<div class="flex items-center gap-xs mt-xs text-on-surface-variant font-label-sm text-label-sm">
<span class="text-sm grayscale">🪙</span> Custa 300 moedas
                        </div>
</div>
</div>

<span class="font-label-sm text-label-sm text-primary font-bold">120 / 300</span>
</div>

</div>

<span class="font-label-sm text-label-sm font-bold">Recompensas</span>
</a>

<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-primary-fixed-dim/20 transition-all rounded-xl" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>
<span class="font-label-sm text-label-sm">Perfil</span>
</a>
