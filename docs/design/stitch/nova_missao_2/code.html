<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Habitinhos - Nova Missão</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed": "#001e2b",
                        "on-background": "#171d1c",
                        "on-secondary-container": "#446779",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb77f",
                        "on-tertiary-fixed-variant": "#6f3800",
                        "on-tertiary-fixed": "#2f1500",
                        "secondary-fixed-dim": "#a7cce0",
                        "on-error-container": "#93000a",
                        "background": "#f5fbf8",
                        "tertiary": "#8e4e11",
                        "on-primary-fixed-variant": "#00504a",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#773d00",
                        "inverse-surface": "#2b3231",
                        "secondary": "#3f6375",
                        "error": "#ba1a1a",
                        "outline": "#6c7a77",
                        "secondary-fixed": "#c3e8fd",
                        "surface-container-low": "#eff5f3",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#274b5c",
                        "inverse-on-surface": "#ecf2f0",
                        "surface-dim": "#d5dbd9",
                        "on-primary-fixed": "#00201d",
                        "primary-container": "#4fd1c5",
                        "surface-container-highest": "#dee4e2",
                        "primary-fixed-dim": "#5adace",
                        "surface-variant": "#dee4e2",
                        "inverse-primary": "#5adace",
                        "on-error": "#ffffff",
                        "primary-fixed": "#79f7ea",
                        "primary": "#006a63",
                        "tertiary-container": "#ffab67",
                        "on-secondary": "#ffffff",
                        "surface-container-high": "#e3e9e7",
                        "secondary-container": "#c0e5fa",
                        "error-container": "#ffdad6",
                        "surface": "#f5fbf8",
                        "on-primary-container": "#005750",
                        "on-surface": "#171d1c",
                        "tertiary-fixed": "#ffdcc4",
                        "surface-tint": "#006a63",
                        "surface-bright": "#f5fbf8",
                        "on-surface-variant": "#3c4947",
                        "outline-variant": "#bbc9c7",
                        "surface-container": "#e9efed"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "margin-mobile": "20px",
                        "lg": "24px",
                        "gutter": "16px",
                        "unit": "4px",
                        "md": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "xs": "4px",
                        "margin-tablet": "48px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Inter"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-xl": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-lg-mobile": ["20px", { "lineHeight": "28px", "fontWeight": "700" }],
                        "headline-lg": ["24px", { "lineHeight": "32px", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        /* Hide scrollbar for horizontal scrolling areas */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Ambient Depth Shadow */
        .shadow-ambient {
            box-shadow: 0px 4px 20px rgba(45, 55, 72, 0.08);
        }
        
        /* Custom Switch */
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4FD1C5;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4FD1C5;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-lg min-h-screen pb-xl">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto docked full-width top-0 sticky z-50">
<div class="flex items-center gap-md">
<button class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center hover:bg-surface-container-low transition-colors" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface-variant">arrow_back</span>
</button>
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-xl">
                👦
            </div>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary">
            Habitinhos
        </div>
<div class="w-10 h-10 flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary-container" data-weight="fill" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
</div>
</header>
<!-- Main Content Form Canvas -->
<main class="px-margin-mobile pt-md max-w-2xl mx-auto space-y-lg">
<!-- Page Title -->
<div>
<h1 class="font-headline-xl text-headline-xl text-on-surface">Nova Missão</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-unit">Crie uma nova atividade para seus pequenos heróis.</p>
</div>
<form class="space-y-lg">
<!-- Título Input -->
<div class="flex flex-col space-y-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit" for="titulo">Título</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-md font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors w-full shadow-ambient" id="titulo" placeholder="Ex: Arrumar a cama" type="text"/>
</div>
<!-- Descrição Input -->
<div class="flex flex-col space-y-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit" for="descricao">Descrição (opcional)</label>
<textarea class="bg-surface-container-lowest border border-outline-variant rounded-xl px-md py-md font-body-md text-body-md text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-colors w-full resize-none shadow-ambient" id="descricao" placeholder="Detalhes de como fazer..." rows="2"></textarea>
</div>
<!-- Emoji Selector -->
<div class="flex flex-col space-y-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit">Ícone da Missão</label>
<div class="flex overflow-x-auto gap-md pb-xs no-scrollbar">
<!-- Selected Emoji -->
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-primary-container/20 border-2 border-primary-container flex items-center justify-center text-[24px] shadow-sm transition-transform active:scale-95" type="button">
                        🛏️
                    </button>
<!-- Unselected Emojis -->
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-surface-container flex items-center justify-center text-[24px] hover:bg-surface-container-high transition-colors" type="button">
                        🪥
                    </button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-surface-container flex items-center justify-center text-[24px] hover:bg-surface-container-high transition-colors" type="button">
                        🧸
                    </button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-surface-container flex items-center justify-center text-[24px] hover:bg-surface-container-high transition-colors" type="button">
                        🍽️
                    </button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-surface-container flex items-center justify-center text-[24px] hover:bg-surface-container-high transition-colors" type="button">
                        📚
                    </button>
<button class="w-12 h-12 flex-shrink-0 rounded-full bg-surface-container flex items-center justify-center text-[24px] hover:bg-surface-container-high transition-colors" type="button">
                        🪴
                    </button>
</div>
</div>
<!-- Coin Reward Input -->
<div class="flex flex-col space-y-unit bg-surface-container-lowest rounded-xl p-md border border-outline-variant shadow-ambient">
<label class="font-label-sm text-label-sm text-on-surface-variant">Recompensa</label>
<div class="flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-tertiary-container/20 flex items-center justify-center flex-shrink-0 shadow-inner">
<span class="material-symbols-outlined text-tertiary-container text-[28px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
</div>
<div class="flex-grow">
<input class="w-full accent-tertiary-container h-2 bg-surface-container rounded-full appearance-none cursor-pointer" max="50" min="1" type="range" value="10"/>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-tertiary-container w-8 text-right">
                        10
                    </div>
</div>
</div>
<!-- Recurrence Picker -->
<div class="flex flex-col space-y-unit">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit">Frequência</label>
<div class="flex flex-wrap gap-sm">
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md border border-transparent hover:bg-surface-container-high transition-colors" type="button">
                        Única
                    </button>
<button class="px-md py-sm rounded-full bg-primary-container text-on-primary-container font-label-md text-label-md border border-primary-container shadow-sm transition-colors" type="button">
                        Diária
                    </button>
<button class="px-md py-sm rounded-full bg-surface-container text-on-surface-variant font-label-md text-label-md border border-transparent hover:bg-surface-container-high transition-colors" type="button">
                        Semanal
                    </button>
</div>
</div>
<!-- Child Assignment -->
<div class="flex flex-col space-y-sm">
<label class="font-label-sm text-label-sm text-on-surface-variant ml-unit">Quem deve fazer?</label>
<div class="flex gap-md">
<!-- Child 1 (Selected) -->
<label class="flex flex-col items-center gap-unit cursor-pointer relative">
<input checked="" class="peer sr-only" type="checkbox"/>
<div class="w-14 h-14 rounded-full bg-secondary-container flex items-center justify-center text-[28px] border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-primary-container/20 transition-all shadow-sm">
                            👦
                        </div>
<div class="absolute -top-1 -right-1 w-5 h-5 bg-primary-container rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-primary text-[14px]">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface peer-checked:font-bold">Leo</span>
</label>
<!-- Child 2 (Unselected) -->
<label class="flex flex-col items-center gap-unit cursor-pointer relative">
<input class="peer sr-only" type="checkbox"/>
<div class="w-14 h-14 rounded-full bg-tertiary-container/30 flex items-center justify-center text-[28px] border-2 border-transparent peer-checked:border-primary-container peer-checked:bg-primary-container/20 transition-all">
                            👧
                        </div>
<div class="absolute -top-1 -right-1 w-5 h-5 bg-primary-container rounded-full flex items-center justify-center opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-on-primary text-[14px]">check</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant peer-checked:text-on-surface peer-checked:font-bold">Mia</span>
</label>
</div>
</div>
<!-- Requires Approval Toggle -->
<div class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-ambient mt-md">
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-surface">Exigir aprovação?</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-xs">A tarefa só é concluída após você validar.</span>
</div>
<div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 border-surface-container appearance-none cursor-pointer transition-all duration-300 z-10 top-0 left-0" id="approval-toggle" name="toggle" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-6 rounded-full bg-surface-container cursor-pointer transition-colors duration-300" for="approval-toggle"></label>
</div>
</div>
<!-- Primary Action Button -->
<div class="pt-lg pb-margin-tablet">
<button class="w-full bg-primary-container text-on-primary font-label-md text-label-md py-md rounded-xl shadow-ambient hover:bg-primary-fixed-dim transition-all active:scale-95 active:shadow-none flex items-center justify-center gap-sm" style="min-height: 56px;" type="button">
<span class="material-symbols-outlined text-[20px]">save</span>
                    Salvar missão
                </button>
</div>
</form>
</main>
</body></html>
