<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Habitinhos - Dashboard Responsável</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->

      tailwind.config = {
        darkMode: "class",

                    "on-primary-fixed-variant": "#00504a",
                    "on-primary": "#ffffff",
                    "on-tertiary-container": "#773d00",
                    "inverse-surface": "#2b3231",
                    "secondary": "#3f6375",
                    "error": "#ba1a1a",
                    "outline": "#6c7a77",
                    "secondary-fixed": "#c3e8fd",
                    "surface-container-low": "#eff5f3",
                    "on-tertiary": "#ffffff",
                    "on-secondary-fixed-variant": "#274b5c",
                    "inverse-on-surface": "#ecf2f0",
                    "surface-dim": "#d5dbd9",
                    "on-primary-fixed": "#00201d",
                    "primary-container": "#4fd1c5",
                    "surface-container-highest": "#dee4e2",
                    "primary-fixed-dim": "#5adace",
                    "surface-variant": "#dee4e2",
                    "inverse-primary": "#5adace",

                    "primary-fixed": "#79f7ea",
                    "primary": "#006a63",
                    "tertiary-container": "#ffab67",
                    "on-secondary": "#ffffff",
                    "surface-container-high": "#e3e9e7",

                    "error-container": "#ffdad6",
                    "surface": "#f5fbf8",

                    "tertiary-fixed": "#ffdcc4",
                    "surface-tint": "#006a63",
                    "surface-bright": "#f5fbf8",

                    "surface-container": "#e9efed"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",

                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "margin-mobile": "20px",
                    "lg": "24px",
                    "gutter": "16px",
                    "unit": "4px",
                    "md": "16px",
                    "xl": "32px",
                    "sm": "8px",
                    "xs": "4px",
                    "margin-tablet": "48px"
            },
            "fontFamily": {
                    "body-lg": ["Inter", "sans-serif"],
                    "label-sm": ["Inter", "sans-serif"],
                    "label-md": ["Inter", "sans-serif"],
                    "headline-xl": ["Plus Jakarta Sans", "sans-serif"],
                    "headline-lg-mobile": ["Plus Jakarta Sans", "sans-serif"],
                    "headline-lg": ["Plus Jakarta Sans", "sans-serif"],
                    "body-md": ["Inter", "sans-serif"]
            },
            "fontSize": {
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-xl": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "700"}],
                    "headline-lg": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          }
        }
      }
    </script>
<style type="text/tailwindcss">
        @layer utilities {
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .pb-safe {
                padding-bottom: env(safe-area-inset-bottom, 20px);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-background dark:bg-on-background sticky top-0 z-40 w-full">
<div class="flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto">
<!-- Leading Avatar -->
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center shrink-0 overflow-hidden shadow-sm">
<span class="text-xl">👩</span>
</div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary dark:text-primary-fixed">
                Habitinhos
            </h1>
<!-- Trailing Icon -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary dark:text-primary-fixed hover:bg-surface-container-low dark:hover:bg-surface-container-highest transition-colors shrink-0">
<span class="text-xl">⚙️</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="px-margin-mobile pt-md pb-32 flex flex-col gap-lg max-w-7xl mx-auto">
<!-- Header Section -->
<section class="flex flex-col gap-xs">
<h2 class="font-headline-xl text-headline-xl text-on-background">Olá, responsável 👋</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Visão geral da sua família hoje.</p>
</section>
<!-- Family Summary Bento Card -->
<section class="bg-surface-container-lowest rounded-xl p-md border border-surface-container flex justify-between items-center">
<div class="flex flex-col items-center flex-1 border-r border-surface-container last:border-0">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">2</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Crianças</span>
</div>
<div class="flex flex-col items-center flex-1 border-r border-surface-container last:border-0">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-tertiary-container relative">
                    3
                    <span class="absolute -top-1 -right-2 w-2 h-2 bg-error rounded-full"></span>
</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Aprovar</span>
</div>
<div class="flex flex-col items-center flex-1">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-secondary">8</span>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-1">Ativas</span>
</div>
</section>
<!-- Quick Actions (Horizontal Scroll) -->
<section class="-mx-margin-mobile px-margin-mobile overflow-x-auto no-scrollbar">
<div class="flex gap-md w-max pb-unit">
<button class="bg-primary-container text-on-primary-container rounded-[16px] px-md py-sm flex items-center justify-center gap-sm min-h-[56px] transition-all active:scale-95">
<span class="text-[20px]">➕</span>
<span class="font-label-md text-label-md">Nova missão</span>
</button>
<button class="bg-secondary-container text-on-secondary-container rounded-[16px] px-md py-sm flex items-center justify-center gap-sm min-h-[56px] transition-all active:scale-95">
<span class="text-[20px]">🎁</span>
<span class="font-label-md text-label-md">Nova recompensa</span>
</button>
<button class="bg-surface-container-high text-on-surface rounded-[16px] px-md py-sm flex items-center justify-center gap-sm min-h-[56px] transition-all active:scale-95 border border-outline-variant/50">
<span class="text-[20px]">👶</span>
<span class="font-label-md text-label-md">Adicionar criança</span>
</button>
</div>
</section>
<!-- Child Selector Cards -->
<section class="flex flex-col gap-md">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Suas crianças</h3>
<div class="grid grid-cols-2 gap-md">
<!-- Joaquim -->
<button class="bg-surface-container-lowest rounded-xl p-md border border-surface-container flex flex-col gap-md text-left transition-all active:scale-95 hover:border-primary-container relative overflow-hidden group">
<div class="w-10 h-10 rounded-full bg-secondary-fixed/30 flex items-center justify-center text-xl z-10">👦</div>
<div class="flex flex-col z-10">
<span class="font-label-md text-label-md text-on-background">Joaquim</span>
<div class="flex items-center gap-xs mt-unit text-tertiary-container">
<span class="text-[16px]">🪙</span>
<span class="font-label-sm text-label-sm font-bold">120 moedas</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-unit">4 missões concluídas</span>
</div>
</button>
<!-- Maria -->
<button class="bg-surface-container-lowest rounded-xl p-md border border-surface-container flex flex-col gap-md text-left transition-all active:scale-95 hover:border-primary-container relative overflow-hidden group">
<div class="w-10 h-10 rounded-full bg-tertiary-fixed/30 flex items-center justify-center text-xl z-10">👧</div>
<div class="flex flex-col z-10">
<span class="font-label-md text-label-md text-on-background">Maria</span>
<div class="flex items-center gap-xs mt-unit text-tertiary-container">
<span class="text-[16px]">🪙</span>
<span class="font-label-sm text-label-sm font-bold">85 moedas</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant mt-unit">2 missões concluídas</span>
</div>
</button>
</div>
</section>
<!-- Aguardando Aprovação List -->
<section class="flex flex-col gap-md">
<div class="flex justify-between items-end">
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background">Aguardando aprovação</h3>
<button class="font-label-sm text-label-sm text-primary hover:underline">Ver todas</button>
</div>
<div class="flex flex-col gap-sm">
<!-- Approval Card 1 -->
<div class="bg-surface-container-lowest rounded-xl p-md border border-outline-variant/30 flex items-center justify-between gap-sm">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-secondary-fixed/30 flex items-center justify-center text-xl shrink-0">👦</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-background line-clamp-1">Escovar os dentes</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
                                Por Joaquim • <span class="text-tertiary-container flex items-center"><span class="text-[12px] mr-[2px]">🪙</span> 10</span>
</span>
</div>
</div>
<div class="flex gap-unit shrink-0">
<button aria-label="Rejeitar" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-error hover:bg-error-container transition-colors">
<span class="text-lg">❌</span>
</button>
<button aria-label="Aprovar" class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center transition-colors">
<span class="text-lg">✅</span>
</button>
</div>
</div>
<!-- Approval Card 2 -->
<div class="bg-surface-container-lowest rounded-xl p-md border border-outline-variant/30 flex items-center justify-between gap-sm">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-tertiary-fixed/30 flex items-center justify-center text-xl shrink-0">👧</div>
<div class="flex flex-col">
<span class="font-label-md text-label-md text-on-background line-clamp-1">Arrumar a cama</span>
<span class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-xs">
                                Por Maria • <span class="text-tertiary-container flex items-center"><span class="text-[12px] mr-[2px]">🪙</span> 15</span>
</span>
</div>
</div>
<div class="flex gap-unit shrink-0">
<button aria-label="Rejeitar" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-error hover:bg-error-container transition-colors">
<span class="text-lg">❌</span>
</button>
<button aria-label="Aprovar" class="w-10 h-10 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center transition-colors">
<span class="text-lg">✅</span>
</button>
</div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 pb-safe bg-surface-container dark:bg-surface-container-lowest border-t border-outline-variant rounded-t-xl">
<!-- Tab: Início (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-on-primary-container text-on-primary-container dark:text-primary-fixed rounded-full px-4 py-1 hover:bg-primary-fixed-dim/20 transition-all scale-90 duration-200" href="#">
<span class="text-xl">🏠</span>
<span class="font-label-sm text-label-sm mt-1">Início</span>
</a>
<!-- Tab: Missões (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-primary-fixed-dim/20 transition-all" href="#">
<span class="text-xl">📋</span>
<span class="font-label-sm text-label-sm mt-1">Missões</span>
</a>
<!-- Tab: Recompensas (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-primary-fixed-dim/20 transition-all" href="#">
<span class="text-xl">🎁</span>
<span class="font-label-sm text-label-sm mt-1">Recompensas</span>
</a>
<!-- Tab: Perfil (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline-variant px-4 py-1 hover:bg-primary-fixed-dim/20 transition-all" href="#">
<span class="text-xl">👤</span>
<span class="font-label-sm text-label-sm mt-1">Perfil</span>
</a>
</nav>
</body></html>
