<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        /* Subtle entrance animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card-enter {
            animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

                        "on-error-container": "#93000a",
                        "background": "#f5fbf8",
                        "tertiary": "#8e4e11",
                        "on-primary-fixed-variant": "#00504a",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#773d00",
                        "inverse-surface": "#2b3231",
                        "secondary": "#3f6375",
                        "error": "#ba1a1a",
                        "outline": "#6c7a77",
                        "secondary-fixed": "#c3e8fd",
                        "surface-container-low": "#eff5f3",
                        "on-tertiary": "#ffffff",
                        "on-secondary-fixed-variant": "#274b5c",
                        "inverse-on-surface": "#ecf2f0",
                        "surface-dim": "#d5dbd9",
                        "on-primary-fixed": "#00201d",
                        "primary-container": "#4fd1c5",
                        "surface-container-highest": "#dee4e2",
                        "primary-fixed-dim": "#5adace",
                        "surface-variant": "#dee4e2",
                        "inverse-primary": "#5adace",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background min-h-screen text-on-background font-body-lg antialiased">
<!-- TopAppBar from JSON -->
<header class="bg-background flex justify-between items-center px-margin-mobile h-16 w-full max-w-7xl mx-auto docked full-width top-0 sticky z-40">
<!-- Leading Avatar -->
<div class="w-10 h-10 rounded-full bg-secondary-container flex items-center justify-center text-xl shadow-sm border border-outline-variant/30">
            👦
        </div>
<!-- Headline -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-primary text-center flex-1">
            Habitinhos
        </h1>
<!-- Trailing Icon -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-primary hover:bg-surface-container-low transition-colors active:scale-95 duration-100 ease-in-out">
<span class="material-symbols-outlined" data-icon="monetization_on" style="font-variation-settings: 'FILL' 1;">monetization_on</span>
</button>
</header>
<!-- Main Content Canvas -->
<!-- Navigation shell is suppressed here because this is a focused, transactional view (Approvals). -->
<main class="px-margin-mobile pt-lg pb-xl max-w-md mx-auto">
<header class="mb-lg">
<h2 class="font-headline-xl text-headline-lg-mobile text-on-background mb-xs">Aprovações Pendentes</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Revisar as tarefas concluídas hoje.</p>
</header>
<div class="flex flex-col gap-lg">
<!-- Approval Card 1 (Joaquim) -->
<article class="bg-surface-container-lowest rounded-[24px] border border-outline-variant p-md shadow-sm flex flex-col gap-md animate-card-enter" style="animation-delay: 0.1s;">
<!-- Card Header -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-secondary-container/50 flex items-center justify-center text-[20px]">
                            👦
                        </div>
<span class="font-label-md text-label-md text-on-surface">Joaquim</span>
</div>
<!-- Reward Badge -->
<div class="inline-flex items-center gap-xs px-3 py-1 bg-tertiary-fixed text-on-tertiary-fixed rounded-full shadow-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-sm text-label-sm font-bold">+5 Moedas</span>
</div>
</div>
<!-- Mission Details -->
<div class="bg-surface-container-low rounded-xl p-md flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-[24px]">
                        🪥
                    </div>
<div class="flex-1">
<h3 class="font-label-md text-label-md text-on-background">Escovar os dentes</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">Concluído às 08:30</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center gap-md mt-xs">
<button class="flex-1 h-12 bg-error-container/40 text-on-error-container hover:bg-error-container/60 rounded-xl font-label-md text-label-md flex justify-center items-center gap-sm active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[20px]">close</span>
                        Rejeitar
                    </button>
<button class="flex-1 h-12 bg-primary-container text-on-primary-container hover:bg-primary-fixed-dim rounded-xl font-label-md text-label-md flex justify-center items-center gap-sm active:scale-95 shadow-sm transition-all duration-200">
<span class="material-symbols-outlined text-[20px]">check</span>
                        Aprovar
                    </button>
</div>
</article>
<!-- Approval Card 2 (Maria) -->
<article class="bg-surface-container-lowest rounded-[24px] border border-outline-variant p-md shadow-sm flex flex-col gap-md animate-card-enter" style="animation-delay: 0.2s;">
<!-- Card Header -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-sm">
<div class="w-10 h-10 rounded-full bg-primary-container/30 flex items-center justify-center text-[20px]">
                            👧
                        </div>
<span class="font-label-md text-label-md text-on-surface">Maria</span>
</div>
<!-- Reward Badge -->
<div class="inline-flex items-center gap-xs px-3 py-1 bg-tertiary-fixed text-on-tertiary-fixed rounded-full shadow-sm">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">stars</span>
<span class="font-label-sm text-label-sm font-bold">+10 Moedas</span>
</div>
</div>
<!-- Mission Details -->
<div class="bg-surface-container-low rounded-xl p-md flex items-center gap-md">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest shadow-sm flex items-center justify-center text-[24px]">
                        🧸
                    </div>
<div class="flex-1">
<h3 class="font-label-md text-label-md text-on-background">Guardar brinquedos</h3>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs">Concluído às 10:15</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex items-center gap-md mt-xs">
<button class="flex-1 h-12 bg-error-container/40 text-on-error-container hover:bg-error-container/60 rounded-xl font-label-md text-label-md flex justify-center items-center gap-sm active:scale-95 transition-all duration-200">
<span class="material-symbols-outlined text-[20px]">close</span>
                        Rejeitar
                    </button>
<button class="flex-1 h-12 bg-primary-container text-on-primary-container hover:bg-primary-fixed-dim rounded-xl font-label-md text-label-md flex justify-center items-center gap-sm active:scale-95 shadow-sm transition-all duration-200">
<span class="material-symbols-outlined text-[20px]">check</span>
                        Aprovar
                    </button>
</div>
</article>
</div>
</main>
<script>
        // Simple script to handle button clicks for demonstration
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                // Add a quick visual pop effect on top of CSS active state
                this.style.transform = 'scale(0.92)';
                setTimeout(() => {
                    this.style.transform = '';
                }, 150);

                // If it's an approve/reject button, we could animate the card away
                if(this.textContent.includes('Aprovar') || this.textContent.includes('Rejeitar')) {
                    const card = this.closest('article');
                    if(card) {
                        card.style.transition = 'all 0.3s ease';
                        card.style.opacity = '0';
                        card.style.transform = 'scale(0.95)';
                        setTimeout(() => {
                            card.style.display = 'none';
                        }, 300);
                    }
                }
            });
        });
    </script>
</body></html>
